<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Roblox Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }
        #status {
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="status">Checking status...</div>

    <script>
        async function checkUserStatus(userId) {
            try {
                // Fetch the status of the user
                const response = await fetch(`https://presence.roblox.com/v1/presence/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userIds: [userId] })
                });

                const data = await response.json();
                const statusElement = document.getElementById('status');

                if (data.userPresences && data.userPresences[0].userPresenceType === 2) {
                    // User is online
                    document.body.style.backgroundColor = "green";
                    statusElement.textContent = "You are ONLINE!";
                } else {
                    // User is offline
                    document.body.style.backgroundColor = "red";
                    statusElement.textContent = "You are OFFLINE!";
                }
            } catch (error) {
                console.error("Error fetching user status:", error);
                document.getElementById('status').textContent = "Error checking status.";
            }
        }

        // Your Roblox user ID
        const robloxUserId = 7158266237;
        checkUserStatus(robloxUserId);

        // Refresh status every 30 seconds (optional)
        setInterval(() => checkUserStatus(robloxUserId), 30000);
    </script>
</body>
</html>
